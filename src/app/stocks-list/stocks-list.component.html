<div class="table-wrapper">
  <div class="search">
    <mat-form-field appearance="fill">
      <input matInput (keyup)="applyFilter($event)" placeholder="Search" #input>
    </mat-form-field>
  </div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

    <ng-container matColumnDef="symbol">
      <th mat-header-cell *matHeaderCellDef> Symbol </th>
      <td mat-cell *matCellDef="let element"> {{element.symbol}} </td>
    </ng-container>

    <ng-container matColumnDef="change">
      <th mat-header-cell *matHeaderCellDef> Change </th>
      <td mat-cell *matCellDef="let element"> {{element.change}} </td>
    </ng-container>

    <ng-container matColumnDef="changeInPercent">
      <th mat-header-cell *matHeaderCellDef> Change In Percent </th>
      <td mat-cell *matCellDef="let element"> {{element.changeInPercent}} </td>
    </ng-container>

    <ng-container matColumnDef="lastTradePriceOnly">
      <th mat-header-cell *matHeaderCellDef> Last Trade Price Only </th>
      <td mat-cell *matCellDef="let element"> {{element.lastTradePriceOnly}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="navigateToStock(row.symbol)" style="cursor: pointer;"></tr>

    Row shown when there is no matching data.
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
    </tr>
  </table>
</div>
